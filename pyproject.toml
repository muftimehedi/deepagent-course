[project]
name = "deepagent-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "muftimehedi", email = "muftimehedi@kahf.co" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.21",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.4",
]

[project.scripts]
deepagent-course = "deepagent_course:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
